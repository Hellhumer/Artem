<!doctype html><html lang="ru" data-theme="dark" data-palette="slate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#111522"><title>Своз — вход</title><style>/* The six colours of each palette come from the supplied references. */
:root {
  --p0: #111522;
  --p1: #1e263b;
  --p2: #303d59;
  --p3: #536684;
  --p4: #98a9c4;
  --p5: #dce3ef;
}
:root[data-palette="coffee"] {
  --p0: #211b1a;
  --p1: #382a28;
  --p2: #60433d;
  --p3: #916b60;
  --p4: #c1a094;
  --p5: #e8d8ce;
}
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--p0);
  --text: var(--p5);
  --muted: var(--p4);
  --green: var(--p4);
  --accent-soft: color-mix(in srgb, var(--p3) 27%, transparent);
  --surface: color-mix(in srgb, var(--p1) 68%, transparent);
  --surface-2: color-mix(in srgb, var(--p0) 63%, transparent);
  --surface-3: color-mix(in srgb, var(--p2) 62%, transparent);
  --solid-surface: var(--p1);
  --input-bg: color-mix(in srgb, var(--p0) 60%, transparent);
  --panel-bg: color-mix(in srgb, var(--p1) 88%, transparent);
  --line: color-mix(in srgb, var(--p4) 24%, transparent);
  --glass-edge: color-mix(in srgb, var(--p5) 19%, transparent);
  --shine: color-mix(in srgb, var(--p5) 10%, transparent);
  --primary-bg: var(--p4);
  --primary-text: var(--p0);
  --primary-hover: var(--p5);
  --shadow: 0 18px 50px color-mix(in srgb, var(--p0) 46%, transparent);
  --glass-shadow: inset 0 1px 0 var(--glass-edge), 0 12px 36px color-mix(in srgb, var(--p0) 25%, transparent);
  --danger: #efb4a9;
  --danger-bg: #843d352a;
  background: var(--bg);
  color: var(--text);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: var(--p5);
  --text: var(--p0);
  --muted: var(--p2);
  --green: var(--p2);
  --accent-soft: color-mix(in srgb, var(--p4) 30%, transparent);
  --surface: color-mix(in srgb, var(--p5) 62%, transparent);
  --surface-2: color-mix(in srgb, var(--p5) 76%, transparent);
  --surface-3: color-mix(in srgb, var(--p4) 30%, transparent);
  --solid-surface: var(--p5);
  --input-bg: color-mix(in srgb, var(--p5) 78%, transparent);
  --panel-bg: color-mix(in srgb, var(--p5) 92%, transparent);
  --line: color-mix(in srgb, var(--p3) 28%, transparent);
  --glass-edge: color-mix(in srgb, var(--p5) 85%, transparent);
  --shine: color-mix(in srgb, var(--p5) 45%, transparent);
  --primary-bg: var(--p2);
  --primary-text: var(--p5);
  --primary-hover: var(--p1);
  --shadow: 0 18px 50px color-mix(in srgb, var(--p2) 15%, transparent);
  --glass-shadow: inset 0 1px 0 var(--glass-edge), 0 12px 36px color-mix(in srgb, var(--p3) 10%, transparent);
  --danger: #8c3d32;
  --danger-bg: #b9706030;
}
html { min-height: 100%; background: var(--bg); }
body {
  color: var(--text);
  background: transparent;
  isolation: isolate;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 0% 0%, color-mix(in srgb, var(--p3) 52%, transparent), transparent 44%),
    radial-gradient(ellipse at 96% 30%, color-mix(in srgb, var(--p2) 66%, transparent), transparent 48%),
    radial-gradient(ellipse at 40% 100%, color-mix(in srgb, var(--p3) 24%, transparent), transparent 50%),
    var(--bg);
}
:root[data-theme="light"] body::before {
  background:
    radial-gradient(ellipse at 0% 0%, color-mix(in srgb, var(--p4) 72%, transparent), transparent 55%),
    radial-gradient(ellipse at 100% 45%, color-mix(in srgb, var(--p3) 18%, transparent), transparent 52%),
    var(--bg);
}
::selection { background: var(--p3); color: var(--p5); }
input, select, textarea { accent-color: var(--green); }
option { background: var(--solid-surface); color: var(--text); }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
.gate-card { position: relative; width: 100%; max-width: 430px; padding: 37px; border: 1px solid var(--line); border-radius: 30px; background: linear-gradient(145deg, var(--shine), transparent 50%), var(--surface); box-shadow: inset 0 1px 0 var(--glass-edge), 0 28px 90px color-mix(in srgb, var(--p0) 32%, transparent); -webkit-backdrop-filter: blur(28px) saturate(125%); backdrop-filter: blur(28px) saturate(125%); }
.gate-brand { display: flex; gap: 11px; align-items: center; font-size: 32px; font-weight: 700; letter-spacing: -1.6px; margin-bottom: 34px; }
.gate-logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: var(--p0); background: linear-gradient(145deg, var(--p5), var(--p4)); box-shadow: inset 0 1px 0 var(--p5); }
.gate-eyebrow { display: block; margin: 0 0 13px; color: var(--muted); font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; }
h1 { font-size: 28px; font-weight: 600; letter-spacing: -1px; margin: 0 0 13px; }
p { font-size: 13px; color: var(--muted); line-height: 1.75; margin: 0 0 28px; }
label { font-size: 12px; color: var(--text); }
input { display: block; width: 100%; background: var(--input-bg); border: 1px solid var(--line); border-radius: 13px; color: var(--text); font: inherit; font-size: 17px; padding: 14px; margin: 10px 0 17px; }
button { cursor: pointer; font: inherit; touch-action: manipulation; }
#submit { width: 100%; padding: 14px; font-size: 14px; font-weight: 650; border: 1px solid var(--glass-edge); border-radius: 13px; background: var(--primary-bg); color: var(--primary-text); box-shadow: inset 0 1px 0 var(--glass-edge); }
#submit:hover { background: var(--primary-hover); }
button:disabled { opacity: .6; }
small { display: block; color: var(--muted); font-size: 10px; line-height: 1.8; margin-top: 22px; }
#error { color: var(--danger); font-size: 12px; line-height: 1.5; margin-top: 12px; min-height: 18px; }
.gate-appearance { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 20px; margin-top: 22px; }
.gate-appearance button { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; background: var(--surface-3); border: 1px solid var(--line); padding: 9px 12px; border-radius: 11px; }
.gate-dot { width: 13px; height: 13px; border-radius: 50%; background: linear-gradient(135deg, var(--p3), var(--p5)); border: 1px solid var(--glass-edge); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
@media(max-width: 480px) { body { padding: 19px; } .gate-card { padding: 29px 25px; border-radius: 27px; } }
@media(prefers-reduced-transparency: reduce) { .gate-card { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--solid-surface); } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .gate-card { background: var(--solid-surface); } }

const appearancePalettes={
 slate:['Север','#98A9C4','Графит, прохладный синий и серебро',['#111522','#1E263B','#303D59','#536684','#98A9C4','#DCE3EF']],
 coffee:['Кофе','#C1A094','Какао, тёплая глина и молочный',['#211B1A','#382A28','#60433D','#916B60','#C1A094','#E8D8CE']]
};
function readAppearance(){
 const value={mode:'dark',accent:'slate',version:2};
 try{
  const saved=JSON.parse(localStorage.getItem('svoz-design')||'null');
  if(saved&&['light','dark','system'].includes(saved.mode))value.mode=saved.mode;
  if(saved&&appearancePalettes[saved.accent])value.accent=saved.accent;
  else if(saved&&['amber','rose'].includes(saved.accent))value.accent='coffee';
 }catch{}
 return value;
}
function paintAppearance(value){
 const dark=value.mode==='dark'||value.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;
 const root=document.documentElement;
 root.dataset.theme=dark?'dark':'light';root.dataset.palette=value.accent;
 root.style.removeProperty('--green');root.style.removeProperty('--accent-soft');
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',appearancePalettes[value.accent][3][dark?0:5]);
}
function saveAppearance(value){localStorage.setItem('svoz-design',JSON.stringify({...value,version:2}));}

const gateAppearance=readAppearance();
function gatePaint(){const label=document.getElementById('gate-palette-label'),modeButton=document.getElementById('gate-mode');if(!label||!modeButton)return;paintAppearance(gateAppearance);label.textContent=appearancePalettes[gateAppearance.accent][0];modeButton.textContent=document.documentElement.dataset.theme==='dark'?'Светлый вид':'Тёмный вид';}
gatePaint();
document.getElementById('gate-palette').onclick=()=>{gateAppearance.accent=gateAppearance.accent==='slate'?'coffee':'slate';try{saveAppearance(gateAppearance);}catch{}gatePaint();};
document.getElementById('gate-mode').onclick=()=>{gateAppearance.mode=document.documentElement.dataset.theme==='dark'?'light':'dark';try{saveAppearance(gateAppearance);}catch{}gatePaint();};
const gateMedia=matchMedia('(prefers-color-scheme: dark)');gateMedia.addEventListener('change',gatePaint);
